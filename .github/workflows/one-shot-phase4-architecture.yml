name: One-shot v5 Phase 4 architecture correction

on:
  push:
    branches:
      - agent/phase-4-toast
    paths:
      - '.github/workflows/one-shot-phase4-architecture.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-4-toast
      - name: Apply Phase 4 patch
        run: python3 tools/phase4_patch.py
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-phase4-architecture.yml tools/phase4_patch.py
          git add src/ui/app_shell.js src/render/scene_3d.js src/ui/hud/context_hud.js src/ui/hud/validity_strip.js src/ui/shell.js tests/v5_phase4_architecture.test.mjs
          git diff --cached --check
          git commit -m 'Align Phase 4 workflow and pane architecture to v5'
          git push origin HEAD:agent/phase-4-toast
