name: One-shot v5 solver patch

on:
  push:
    branches:
      - agent/phase-4-toast
    paths:
      - '.github/workflows/one-shot-v5-solver-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-4-toast
      - name: Apply exact solver patch
        run: python3 tools/apply_v5_solver_patch.py
      - name: Commit patched solver
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/scene/solve_network.js
          git diff --cached --check
          git commit -m 'Apply exact v5 solver geometry patch'
          git push origin HEAD:agent/phase-4-toast
