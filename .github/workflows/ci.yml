name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
      - run: npm run validate
      - name: Capture ACC-SHOT-01 candidates
        run: python3 tools/screenshot_gate.py --capture-only
      - name: Upload ACC-SHOT-01 candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc-shot-current
          path: tests/screenshots/current/*.png
      - name: Record exact branch source state
        if: always()
        shell: bash
        run: |
          git ls-tree -r HEAD > source-tree.txt
          tar -czf source-state.tgz src tests fixtures tools package.json .github/workflows/ci.yml
      - name: Upload exact branch source state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-state
          path: |
            source-tree.txt
            source-state.tgz
