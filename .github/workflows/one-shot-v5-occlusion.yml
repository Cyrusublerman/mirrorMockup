name: One-shot v5 physical P occlusion

on:
  push:
    branches:
      - agent/phase-4-toast
    paths:
      - '.github/workflows/one-shot-v5-occlusion.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-4-toast
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply physical P occlusion patch
        run: python3 tools/_one_shot_v5_occlusion.py
      - run: npm ci
      - name: Full acceptance
        run: npm test
      - name: Architecture validator
        run: npm run validate
      - name: Commit green source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests
          git diff --cached --check
          git commit -m 'Connect physical occlusion to the P screen gate'
          git push origin HEAD:agent/phase-4-toast
