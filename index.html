<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>P0 composition tool</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
  html, body, #app { margin: 0; height: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none; }
</style>
<body>
<div id="app"></div>
<script type="module">
  window.addEventListener("error", (e) => {
    const root = document.getElementById("app");
    if (root.querySelector(".mp-app")) return;
    const box = document.createElement("div");
    box.id = "boot-fail";
    box.setAttribute("role", "alert");
    const p = document.createElement("p");
    p.textContent = String(e.message || "boot error");
    box.appendChild(p);
    root.replaceChildren(box);
  });
  import { boot } from "./src/app/boot.js";
  boot(document.getElementById("app"));
</script>
</body>
</html>
