<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P0 composition tool</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
  :root { font-family: ui-sans-serif, system-ui, sans-serif; color: #111; background: #f6f4ef; }
  html, body { margin: 0; height: 100%; }
  #app { height: 100%; display: flex; flex-direction: column; }
  .top { display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #ddd; background: #fff; flex-wrap: wrap; }
  .modes button { border: 1px solid #111; background: #fff; border-radius: 999px; padding: 4px 10px; }
  .main { flex: 1; display: grid; grid-template-columns: 220px 1fr 280px; min-height: 0; }
  .stage { position: relative; background: #eee; }
  #scene, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  #overlay { pointer-events: none; }
  aside { overflow: auto; padding: 10px; font-size: 12px; background: #fff; }
  .right { border-left: 1px solid #ddd; }
  .ref { border-right: 1px solid #ddd; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 2px 0; vertical-align: top; }
  label { display: flex; justify-content: space-between; gap: 8px; margin: 4px 0; }
  input, select { max-width: 110px; }
  pre { white-space: pre-wrap; font-size: 11px; }
  #hud { margin-left: auto; font-size: 12px; }
</style>
<body>
<div id="app"></div>
<script type="module">
  import { boot } from "./src/ui/interactions.js";
  boot(document.getElementById("app"));
</script>
</body>
</html>
