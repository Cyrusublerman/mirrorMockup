<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://raw.githack.com; object-src 'none'; base-uri 'none'">
<title>P0 composition tool (remote repo)</title>
<script>
  (function () {
    window.addEventListener("error", function (e) {
      if (window.MIRROR_BOOT_ERROR) return;
      window.MIRROR_BOOT_ERROR = String(e && e.message || e);
    });
    window.addEventListener("unhandledrejection", function (e) {
      if (window.MIRROR_BOOT_ERROR) return;
      window.MIRROR_BOOT_ERROR = String(e && e.reason || e);
    });
    var OWNER = "Cyrusublerman";
    var REPO = "mirrorMockup";
    var PINNED = "49632d9779cbbea22ec37e1eb3dc9fa61dd09465";
    var LOCAL = { "127.0.0.1": 1, "localhost": 1, "[::1]": 1 };
    var params = new URLSearchParams(location.search);
    var repo = params.get("repo");
    var origin = null;
    var err = null;
    function slash(u) {
      var x = new URL(u, location.href);
      if (!x.pathname.endsWith("/")) x.pathname += "/";
      x.search = "";
      x.hash = "";
      return x.href;
    }
    if (repo) {
      try {
        var u = new URL(repo, location.href);
        if (!LOCAL[u.hostname]) throw new Error("repo host not allowed");
        if (u.protocol !== "http:" && u.protocol !== "https:") throw new Error("repo protocol not allowed");
        origin = slash(u.href);
      } catch (e) {
        err = String(e && e.message || e);
      }
    } else {
      var ref = params.get("ref") || PINNED;
      if (!/^[0-9a-f]{7,40}$/i.test(ref)) {
        err = "ref must be a commit SHA";
        ref = PINNED;
      }
      origin = params.get("cdn") === "jsdelivr"
        ? ("https://cdn.jsdelivr.net/gh/" + OWNER + "/" + REPO + "@" + ref + "/")
        : ("https://raw.githack.com/" + OWNER + "/" + REPO + "/" + ref + "/");
    }
    window.MIRROR_BOOT_ERROR = err;
    window.MIRROR_REPO = origin;
    window.MIRROR_PINNED = PINNED;
  })();
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
  html, body, #app { margin: 0; height: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none; touch-action: none; font-family: ui-sans-serif, system-ui, sans-serif; background: #F7F5EF; color: #181818; }
  #boot-fail { margin: 24px; max-width: 44rem; }
</style>
<body>
<div id="app"></div>
<script type="module">
  const root = document.getElementById("app");
  function fail(msg, detail) {
    const box = document.createElement("div");
    box.id = "boot-fail";
    box.setAttribute("role", "alert");
    const p = document.createElement("p");
    p.textContent = msg;
    box.appendChild(p);
    if (detail) {
      const pre = document.createElement("pre");
      pre.textContent = detail;
      box.appendChild(pre);
    }
    root.replaceChildren(box);
  }
  if (window.MIRROR_BOOT_ERROR) {
    fail(window.MIRROR_BOOT_ERROR);
  } else if (!window.MIRROR_REPO) {
    fail("no trusted module origin");
  } else {
    const repo = window.MIRROR_REPO;
    let boot;
    try {
      ({ boot } = await import(new URL("src/app/boot.js", repo).href));
    } catch (err) {
      fail("Failed to load modules from " + String(repo), String(err && err.stack || err));
      throw err;
    }
    try {
      await boot(root);
    } catch (err) {
      fail("Failed to start the tool", String(err && err.stack || err));
      console.error(err);
    }
  }
</script>
</body>
</html>
