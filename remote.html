<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>P0 composition tool (remote repo)</title>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var q = params.get("repo");
    var ref = params.get("ref") || "main";
    var repo = (q || (params.get("cdn") === "jsdelivr"
      ? ("https://cdn.jsdelivr.net/gh/Cyrusublerman/mirrorMockup@" + ref + "/")
      : ("https://raw.githack.com/Cyrusublerman/mirrorMockup/" + ref + "/"))).replace(/\/?$/, "/");
    var base = document.createElement("base");
    base.href = repo;
    document.head.appendChild(base);
    window.MIRROR_REPO = repo;
  })();
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; height: 100dvh; font-family: ui-sans-serif, system-ui, sans-serif; background: #f6f4ef; }
  #app { height: 100%; display: flex; flex-direction: column; }
  .stage { position: relative; flex: 1 1 auto; min-height: 55vh; min-height: 55dvh; background: #d9d4cb; }
  #scene, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { pointer-events: none; }
  #boot-fail { margin: 24px; max-width: 44rem; color: #111; }
</style>
<body>
<div id="app"></div>
<script type="module">
  const repo = window.MIRROR_REPO;
  const root = document.getElementById("app");
  try {
    const { boot } = await import(new URL("src/ui/interactions.js", repo).href);
    await boot(root);
  } catch (err) {
    root.innerHTML = `<div id="boot-fail">
      <p>Failed to load <code>${repo}</code></p>
      <p>Copy this file anywhere. It loads the tool from GitHub (jsDelivr). Network required.</p>
      <p>Re-download this file after a merge, or pass <code>?ref=&lt;commit&gt;</code> to skip a stale CDN cache.</p>
      <p>Local clone: serve the repo, then <code>?repo=http://127.0.0.1:8765/</code></p>
      <pre>${String(err && err.stack || err)}</pre>
    </div>`;
    console.error(err);
  }
</script>
</body>
</html>
